<div class="dashboard">

  <!-- =========================
       OVERLAY PARA MÓVIL
  ========================== -->

  @if (menuAbierto()) {
    <div
      class="overlay"
      (click)="cerrarMenu()">
    </div>
  }


  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside
    class="sidebar"
    [class.sidebar-abierto]="menuAbierto()">

    <!-- LOGO -->

    <div class="sidebar-header">

      <div class="logo">

        <div class="logo-icon">
          <img src="img/icono.png" alt="Logo posgrado upea" />
        </div>

        <div class="logo-text">
          <strong>POSGRADO</strong>

          <span>UPEA</span>
        </div>

      </div>

      <button
        class="btn-cerrar"
        type="button"
        (click)="cerrarMenu()"
        aria-label="Cerrar menú">

        ✕
      </button>

    </div>


    <!-- =========================
         NAVEGACIÓN
    ========================== -->

    <nav class="menu">

      <!-- =========================================
          PRINCIPAL — fuera del acordeón, siempre visible
      ========================================== -->
      <p class="menu-title">PRINCIPAL</p>

      <a 
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()">
        <span class="icon">⌂</span>
        <span>Inicio</span>
      </a>

      <!-- =========================================
          CATEGORÍAS COLAPSABLES
      ========================================== -->
      <div id="menuAccordion">
        @for (categoria of categorias; track categoria.id) {
          <div class="menu-category">

            <button
              class="menu-title menu-title--toggle"
              type="button"
              data-toggle="collapse"
              [attr.data-target]="'#cat-' + categoria.id"
              [attr.aria-controls]="'cat-' + categoria.id"
            >
              {{ categoria.titulo }}
              <span class="chevron">▾</span>
            </button>

            <div
              [id]="'cat-' + categoria.id"
              [class]="'collapse '+ categoria.collapse"
              [attr.data-parent]="'#menuAccordion'"
            >
              @for (item of categoria.items; track item.ruta) {
                <a 
                  [routerLink]="item.ruta"
                  routerLinkActive="active"
                  (click)="cerrarMenu()">
                  <span class="icon">{{ item.icono }}</span>
                  <span>{{ item.label }}</span>
                </a>
              }
            </div>

          </div>
        }
      </div>

      <!-- =========================================
          CERRAR SESIÓN — fuera del acordeón
      ========================================== -->
      <a class="logout-btn" (click)="cerrarSesion()">
        <span>🚪</span>
        <span>Cerrar sesión</span>
      </a>

    </nav>


    <!-- =========================
         FOOTER SIDEBAR
    ========================== -->

    <div class="sidebar-footer">

      <div class="usuario">

        <div class="avatar">
          <img src="img/user.png" alt="Avatar">
        </div>

        <div class="usuario-info">

          <strong>Administrador</strong>

          <span>Posgrado UPEA</span>

        </div>

      </div>

    </div>

  </aside>


  <!-- =========================
       CONTENIDO PRINCIPAL
  ========================== -->

  <main class="contenido">

    <!-- HEADER -->

    <header class="topbar">

      <button
        type="button"
        class="btn-menu"
        (click)="abrirCerrarMenu()"
        aria-label="Abrir menú">

        ☰

      </button>


      <div class="breadcrumb">

        <h1>
          Panel Administrativo
        </h1>

        <span>
          Sistema de Gestión de Posgrado
        </span>

      </div>


      <div class="topbar-actions">

        <button
          type="button"
          class="btn-notificacion"
          aria-label="Notificaciones">

          🔔

        </button>

      </div>

    </header>


    <!-- =========================
         CONTENIDO DINÁMICO
    ========================== -->

    <section class="contenido-principal">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
