<section class="editar-persona">

  <div class="encabezado">
    <h1>Editar persona:</h1>
  
    <p>
      Editar sala en el sistema.
    </p>
  </div>

    @if (persona()) {

      <app-persona-editar-form
        [persona]="persona()"
        (guardar)="actualizarDatosPersona($event)"
      />

    } @else {

      <p>Cargando persona...</p>

    }

</section>
