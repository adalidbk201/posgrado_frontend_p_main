<section class="editar-sala">

  <div class="encabezado">
    <h1>Editar sala:</h1>
    <h3>{{ nombre_sala }}</h3>
    <p>
      Editar sala en el sistema.
    </p>
  </div>

    @if (sala()) {

      <app-sala-editar-form
        [sala]="sala()"
        (guardar)="actualizarSala($event)"
        nombre_sala="{{ nombre_sala }}"
      />

    } @else {

      <p>Cargando sala...</p>

    }

</section>
