<section class="editar-sala">

  <div class="encabezado">
     <h1>Editar sala: <p></p> {{ nombre_sala }}</h1>

    <p>
      Editar sala en el sistema.
    </p>
  </div>

    @if (sala()) {

      <app-sala-editar-form
        [sala]="sala()"
        (guardar)="actualizarSala($event)"
      />

    } @else {

      <p>Cargando sala...</p>

    }

</section>
