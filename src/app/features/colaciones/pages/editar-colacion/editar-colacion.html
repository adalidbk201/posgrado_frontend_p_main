<section class="editar-colacion">

  <div class="encabezado">
     <h1>Editar colación</h1>

    <p>
      Editar colación en el sistema.
    </p>
  </div>

    @if (colacion()) {

      <app-colacion-form
        [colacion]="colacion()"
        (guardar)="actualizarColacion($event)"
      />

    } @else {

      <p>Cargando colación...</p>

    }

</section>
