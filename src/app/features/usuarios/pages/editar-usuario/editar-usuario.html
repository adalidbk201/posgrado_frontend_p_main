 <section class="editar-sala">

  <div class="encabezado">
     <h1>Editar sala</h1>

    <p>
      Editar sala en el sistema.
    </p>
  </div>

    @if (usuario()) {

      <app-usuario-form
        [usuario]="usuario()"
        (guardar)="actualizarUsuario($event)"
      />

    } @else {

      <p>Cargando sala...</p>

    }

</section>
