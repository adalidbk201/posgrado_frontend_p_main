 
  <app-activar-cuenta-form
    (guardar)="activarPerfil($event)"
    usuario="{{ usuario }}"
  />
 

@if (cuentaActivada()) {
  <div class="modal-overlay">
    <div class="modal-exito">

      <div class="icono-exito">
        <span>✓</span>
      </div>

      <h2>¡Cuenta activada!</h2>

      <p>
        Tu cuenta ha sido activada correctamente.
      </p>

      <span class="mensaje-redireccion">
        Serás redirigido al inicio de sesión en unos segundos...
      </span>

      <div class="barra-tiempo">
        <div class="barra-progreso"></div>
      </div>

    </div>
  </div>
}

<!-- Error de activacion -->
 @if (errorActivacion()) {
  <div class="modal-overlay">
    <div class="modal-exito modal-error">

      <!-- <div class="icono-error">
        <span>✕</span>
      </div> -->

      <h2>¡Activación fallida!</h2>

      <p>
        {{ mensajeerror() }}
         
      </p>

      <span class="mensaje-redireccion">
        Verifica el código e inténtalo nuevamente.
      </span>

      <button
        type="button"
        class="btn-reintentar"
        (click)="errorActivacion.set(false)">
        Intentar nuevamente
      </button>

    </div>
  </div>
}
