<section id="testimonios" class="testimonios">
  <div class="container">

    <h2 class="testimonios__title">
      Testimonios de Nuestros Graduantes en <span>Posgrado UPEA</span>
    </h2>

    <div class="testimonios__mosaico">
      @for (foto of fotos; track foto.src; let i = $index) {
        <button
          type="button"
          class="testimonios__tile"
          [class.testimonios__tile--disabled]="isMobile()"
          data-aos="fade-up"
          [attr.data-aos-delay]="i * 80"
          (click)="abrirLightbox(i)"
          [attr.aria-label]="'Ampliar: ' + foto.titulo">

          <img [src]="foto.src" [alt]="foto.alt" loading="lazy" />
          <span class="testimonios__caption">{{ foto.titulo }}</span>
        </button>
      }
    </div>

  </div>

  <!-- Lightbox original (solo se renderiza en desktop) -->
  @if (fotoActivaIndex() !== null) {
    <div class="lightbox" (click)="cerrarLightbox()" role="dialog" aria-modal="true"
         aria-label="Vista ampliada de foto de graduados">

      <button type="button" class="lightbox__cerrar" (click)="cerrarLightbox()" aria-label="Cerrar">✕</button>

      <button type="button" class="lightbox__flecha lightbox__flecha--izq"
              (click)="anteriorFoto(); $event.stopPropagation()" aria-label="Foto anterior">‹</button>

      <div class="lightbox__contenido" (click)="$event.stopPropagation()">
        <img [src]="fotos[fotoActivaIndex()!].src" [alt]="fotos[fotoActivaIndex()!].alt" />
        <p class="lightbox__titulo">{{ fotos[fotoActivaIndex()!].titulo }}</p>
        <p class="lightbox__contador">{{ fotoActivaIndex()! + 1 }} / {{ fotos.length }}</p>
      </div>

      <button type="button" class="lightbox__flecha lightbox__flecha--der"
              (click)="siguienteFoto(); $event.stopPropagation()" aria-label="Siguiente foto">›</button>
    </div>
  }
</section>
