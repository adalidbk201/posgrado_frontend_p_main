<section class="como-funciona" id="como-funciona">
  <div class="como-funciona__container">

    <!-- Línea decorativa + Título -->
    <div class="como-funciona__header">
      <!-- <span class="como-funciona__line" aria-hidden="true"></span> -->
      <h2 class="como-funciona__title">Cómo funciona</h2>
    </div>

    <!-- Contenido: pasos + imagen decorativa -->
    <div class="como-funciona__body">

      <!-- Lista de pasos -->
      <ol class="como-funciona__steps">

        <!-- PASO 1 -->
        <li class="como-funciona__step">
          <div class="como-funciona__icon">
            <!-- Ícono: sobre / email -->
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="6" y="18" width="52" height="34" rx="4" fill="currentColor"/>
                <path d="M6 22l26 18L58 22" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
            </svg>
            <span class="como-funciona__badge">1</span>
          </div>
          <h3 class="como-funciona__step-title">Activa tu cuenta</h3>
          <p class="como-funciona__step-desc">
            Te llegará un código al correo electrónico.
          </p>
        </li>

        <!-- Flecha -->
        <li class="como-funciona__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </li>

        <!-- PASO 2 -->
        <li class="como-funciona__step">
          <div class="como-funciona__icon">
            <!-- Ícono: laptop con usuario -->
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="8" y="14" width="48" height="32" rx="3" fill="currentColor"/>
                <circle cx="32" cy="28" r="7" fill="#ffffff"/>
                <path d="M20 40c0-6 5-10 12-10s12 4 12 10" fill="#ffffff"/>
            <rect x="4" y="48" width="56" height="4" rx="2" fill="currentColor"/>
            </svg>
            <span class="como-funciona__badge">2</span>
          </div>
          <h3 class="como-funciona__step-title">Ingresa al sistema</h3>
          <p class="como-funciona__step-desc">
            Accede con tu cuenta institucional.
          </p>
        </li>

        <!-- Flecha -->
        <li class="como-funciona__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </li>

        <!-- PASO 3 -->
        <li class="como-funciona__step">
          <div class="como-funciona__icon">
            <!-- Ícono: butaca con check -->
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="18" y="20" width="28" height="22" rx="4" fill="currentColor"/>
                <rect x="22" y="42" width="6" height="10" rx="2" fill="currentColor"/>
                <rect x="36" y="42" width="6" height="10" rx="2" fill="currentColor"/>
                <circle cx="46" cy="46" r="10" fill="currentColor" stroke="#ffffff" stroke-width="2"/>
            <path d="M41 46l4 4 7-7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="como-funciona__badge">3</span>
          </div>
          <h3 class="como-funciona__step-title">Verifica tu butaca</h3>
          <p class="como-funciona__step-desc">
            Confirma tus datos.
          </p>
        </li>

      </ol>

      <!-- Imagen decorativa (derecha) -->
      <div class="como-funciona__image" aria-hidden="true">
        <img src="/img/butacas.webp" alt="" loading="lazy" />
        <!-- Círculo con check superpuesto -->
        <div class="como-funciona__check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12l5 5L20 7"/>
          </svg>
        </div>
      </div>

    </div>

  </div>
</section>
