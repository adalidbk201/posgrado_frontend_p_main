<div class="toast-container" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-card"
      [class.toast-card--exito]="toast.tipo === 'exito'"
      [class.toast-card--error]="toast.tipo === 'error'"
      [class.toast-card--warning]="toast.tipo === 'warning'"
      [class.toast-card--info]="toast.tipo === 'info'"
      [attr.data-toast-id]="toast.id"
      (mouseenter)="pausarToast(toast.id)"
      (mouseleave)="reanudarToast(toast.id)"
      role="alert"
    >
      <span class="toast-card__acento" aria-hidden="true"></span>

      <div class="toast-card__contenido">
        <div class="toast-card__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="iconoSvg(toast.tipo)"/>
          </svg>
        </div>

        <div class="toast-card__texto">
          <p class="toast-card__titulo">{{ titulo(toast.tipo) }}</p>
          <p class="toast-card__mensaje">{{ toast.mensaje }}</p>
        </div>

        <button
          type="button"
          class="toast-card__cerrar"
          (click)="cerrar(toast.id)"
          aria-label="Cerrar notificación"
        >
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="toast-card__progreso" aria-hidden="true">
        <span class="toast-card__progreso-barra"></span>
      </div>
    </div>
  }
</div>
